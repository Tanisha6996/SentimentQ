<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grover Sentiment Analysis</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <h1 class="text-center">Grover Sentiment Analysis</h1>
        <form id="uploadForm" class="mt-4">
            <div class="mb-3">
                <label for="fileInput" class="form-label">Upload Dataset (CSV)</label>
                <input type="file" class="form-control" id="fileInput" name="file" accept=".csv" required>
            </div>
            <button type="submit" class="btn btn-primary">Upload and Analyze</button>
        </form>
        <hr>
        <div id="results" class="mt-4"></div>
    </div>

    <!-- Inline JavaScript -->
    <script>
        document.getElementById('uploadForm').addEventListener('submit', async (event) => {
            event.preventDefault();

            const fileInput = document.getElementById('fileInput');
            const formData = new FormData();
            formData.append('file', fileInput.files[0]);

            try {
                const response = await fetch('/upload', {
                    method: 'POST',
                    body: formData
                });

                const contentType = response.headers.get('Content-Type');
                if (!response.ok) {
                    if (contentType && contentType.includes('text/html')) {
                        throw new Error('Server returned an HTML error page.');
                    }
                    const errorData = await response.json();
                    throw new Error(errorData.error || 'Unknown error occurred.');
                }

                const data = await response.json();
                const resultsDiv = document.getElementById('results');
                resultsDiv.innerHTML = `
                    <h3>Results</h3>
                    <p><strong>Grover's Search Time:</strong> ${data.performance.grover_time.toFixed(2)} seconds</p>
                    <p><strong>Sentiment Analysis Time:</strong> ${data.performance.sentiment_time.toFixed(2)} seconds</p>
                    <h4>Word Counts</h4>
                    <p>Positive Tweets: ${data.word_counts.positive}</p>
                    <p>Negative Tweets: ${data.word_counts.negative}</p>
                `;
            } catch (error) {
                const resultsDiv = document.getElementById('results');
                resultsDiv.innerHTML = `<p class="text-danger">${error.message}</p>`;
            }
        });
    </script>
</body>
</html>
