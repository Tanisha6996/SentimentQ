<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Performance Charts</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <h1>Performance and Sentiment Analysis Charts</h1>

    <h2>Sentiment Analysis Results</h2>
    <canvas id="sentimentChart" width="400" height="200"></canvas>

    <h2>Performance Comparison</h2>
    <canvas id="performanceChart" width="400" height="200"></canvas>

    <script>
        // Fetch and display sentiment and performance charts
        async function loadCharts() {
            try {
                // Fetch performance data from the backend
                const response = await fetch('/process');
                const data = await response.json();

                if (data.chart_urls) {
                    // Load and display the sentiment chart
                    const sentimentCtx = document.getElementById('sentimentChart').getContext('2d');
                    const sentimentImage = new Image();
                    sentimentImage.src = data.chart_urls.sentiment_chart;
                    sentimentImage.onload = () => {
                        sentimentCtx.drawImage(sentimentImage, 0, 0, 400, 200);
                    };

                    // Load and display the performance chart
                    const performanceCtx = document.getElementById('performanceChart').getContext('2d');
                    const performanceImage = new Image();
                    performanceImage.src = data.chart_urls.performance_chart;
                    performanceImage.onload = () => {
                        performanceCtx.drawImage(performanceImage, 0, 0, 400, 200);
                    };
                } else {
                    alert('Chart data is not available.');
                }
            } catch (error) {
                console.error('Error loading charts:', error);
            }
        }

        // Load charts when the page is ready
        window.onload = loadCharts;
    </script>
</body>
</html>
