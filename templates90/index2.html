<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sentiment Analysis</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <h1 class="text-center">Sentiment Analysis</h1>
        <form id="uploadForm" class="mt-4">
            <div class="mb-3">
                <label for="fileInput" class="form-label">Upload Dataset (CSV)</label>
                <input type="file" class="form-control" id="fileInput" name="file" accept=".csv" required>
            </div>
            <button type="submit" class="btn btn-primary">Upload and Analyze</button>
        </form>
        <hr>
        <div id="results" class="mt-4"></div>
    </div>

    <script>
        document.getElementById('uploadForm').addEventListener('submit', async (event) => {
            event.preventDefault();

            const fileInput = document.getElementById('fileInput');
            const formData = new FormData();
            formData.append('file', fileInput.files[0]);

            const resultsDiv = document.getElementById('results');
            resultsDiv.innerHTML = `<p class="text-info">Processing your dataset. Please wait...</p>`;

            try {
                const response = await fetch('/upload', {
                    method: 'POST',
                    body: formData
                });

                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.error || 'Unknown error occurred.');
                }

                const data = await response.json();
                resultsDiv.innerHTML = `
                    <h3>Results</h3>
                    <p><strong>Grover's Model Time:</strong> ${data.performance.grover_time.toFixed(2)} seconds</p>
                    <p><strong>Generic Model Time:</strong> ${data.performance.generic_time.toFixed(2)} seconds</p>
                    <h4>Sentiment Counts</h4>
                    <p><strong>Grover's Model:</strong> Positive: ${data.sentiment_counts.grover.positive}, Negative: ${data.sentiment_counts.grover.negative}</p>
                    <p><strong>Generic Model:</strong> Positive: ${data.sentiment_counts.generic.positive}, Negative: ${data.sentiment_counts.generic.negative}</p>
                `;
            } catch (error) {
                console.error("Error:", error);
                resultsDiv.innerHTML = `<p class="text-danger">${error.message}</p>`;
            }
        });
    </script>
</body>
</html>
